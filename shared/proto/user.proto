syntax = "proto3";

package user;

service UserService {
  rpc CreateUser (CreateUserRequest) returns (UserResponse);
  rpc GetAllUsers (Empty) returns (UserListResponse);
  rpc GetUserById (GetUserByIdRequest) returns (UserResponse);
  rpc GetUserByEmail (GetUserByEmailRequest) returns (UserResponse);
  rpc GetUserByPhone (GetUserByPhoneRequest) returns (UserResponse);
  rpc UpdateUser (UpdateUserRequest) returns (UserResponse);
  rpc VerifyEmail (VerifyUserRequest) returns (UserResponse);
  rpc VerifyPhone (VerifyUserRequest) returns (UserResponse);
}

message Empty {}

message CreateUserRequest {
  string name = 1;
  optional string email = 2;
  optional string phone = 3;
  optional string password = 4;
  optional string status = 5;
  optional string role = 6;
  optional string otp = 7;
}

message UpdateUserRequest {
  string id = 1;
  optional string name = 2;
  optional string phone = 3;
  optional string status = 4;
}

message GetUserByIdRequest {
  string id = 1;
}

message GetUserByEmailRequest {
  string email = 1;
}

message GetUserByPhoneRequest {
  string phone = 1;
}

message VerifyUserRequest {
  string id = 1;
}

message User {
  string id = 1;
  string name = 2;
  optional string email = 3;
  optional string phone = 4;
  optional string status = 5;
  optional string role = 6;
}

message UserResponse {
  bool success = 1;
  optional string message = 2;
  optional User data = 3;
  optional string error = 4;
}

message UserListResponse {
  bool success = 1;
  repeated User data = 2;
}
